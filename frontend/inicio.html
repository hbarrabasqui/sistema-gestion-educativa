<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestión Educativa DETS</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-oscuro: #153244;
            --amarillo: #FFCC00;
            --cyan: #8DE2D6;
            --blanco: #FFFFFF;
            --gris: #3C3C3B;
            --gris-claro: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Archivo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--azul-oscuro) 0%, #1e4a63 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: var(--blanco);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .login-header {
            background: var(--azul-oscuro);
            color: var(--blanco);
            padding: 2rem;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--blanco);
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--azul-oscuro);
        }

        .login-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .login-form {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--azul-oscuro);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--cyan);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--amarillo);
            color: var(--azul-oscuro);
        }

        .btn-primary:hover {
            background: #e6b800;
            transform: translateY(-2px);
        }

        .login-links {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }

        .login-links a {
            color: var(--azul-oscuro);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gris);
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
            }
            
            .login-form {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">DETS</div>
            <h1>Sistema de Gestión Educativa</h1>
            <p>Dirección de Educación Técnica Superior</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="alert alert-error" id="errorMessage" style="display: none;">
                Usuario o contraseña incorrectos
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <input type="text" class="form-input" id="username" placeholder="Ingrese su usuario" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div class="password-container">
                    <input type="password" class="form-input" id="password" placeholder="Ingrese su contraseña" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>

            <div class="login-links">
                <a href="#" onclick="mostrarCredenciales()">¿Olvidaste tus credenciales?</a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.textContent = '🔒';
            } else {
                passwordInput.type = 'password';
                toggleButton.textContent = '👁️';
            }
        }

        function mostrarCredenciales() {
            alert('Usuarios de prueba:\n\n• admin / admin123\n• docente / docente123\n• supervisor / super123');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // Credenciales de prueba
            const users = {
                'admin': 'admin123',
                'docente': 'docente123', 
                'supervisor': 'super123'
            };

            if (users[username] && users[username] === password) {
                // Login exitoso - guardar en sessionStorage
                sessionStorage.setItem('usuario', username);
                sessionStorage.setItem('rol', username);
                
                // Redirigir a página principal (dashboard)
                window.location.href = 'pantallaprincipal.html';
            } else {
                // Mostrar error
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        });

        // Limpiar error al empezar a escribir
        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
        });

        // Verificar si ya está logueado
        /*
        document.addEventListener('DOMContentLoaded', function() {
            const usuario = sessionStorage.getItem('usuario');
            if (usuario) {
                // Si ya está logueado, redirigir al dashboard
                window.location.href = 'pantallaprincipal.html';
            }
        });
        */  // esta comentado de forma temporal
    </script>
</body>
</html>
